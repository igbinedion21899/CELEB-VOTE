<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarVote — Celebrity Voting</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }
    .dot-pattern {
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
    }
    [x-cloak] {
      display: none !important;
    }
    /* Remove default number input arrows */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-100 selection:text-blue-700"
      x-data="starVoteApp()"
      x-init="initIcons()">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm shadow-blue-600/20 group-hover:bg-blue-700 transition">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-lg tracking-tight text-slate-900">
          Star<span class="text-blue-600">Vote</span>
        </span>
      </a>

      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50/80 border border-blue-100 text-xs font-medium text-blue-700">
          <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-pulse"></span>
          <span>2026 Live Poll</span>
        </div>
        <div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-50 border border-slate-200/80 text-xs font-semibold text-slate-700">
          <i data-lucide="bar-chart-2" class="w-3.5 h-3.5 text-blue-600"></i>
          <span x-text="totalVotes.toLocaleString() + ' Total Votes'"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 dot-pattern">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">

      <!-- Clean Hero Title -->
      <div class="max-w-2xl mb-10">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-xs font-semibold mb-3">
          <i data-lucide="award" class="w-3.5 h-3.5"></i>
          <span>Official Nominees</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">
          Vote for Your Favorite Celebrity
        </h1>
        <p class="mt-2.5 text-sm sm:text-base text-slate-500">
          Select a nominee below to cast your vote. Every vote counts toward the 2026 annual ranking.
        </p>
      </div>

      <!-- Celebrity Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <template x-for="celeb in celebrities" :key="celeb.id">
          <div class="group bg-white rounded-2xl border border-slate-200/80 p-3 shadow-sm hover:shadow-xl hover:shadow-blue-900/5 hover:border-blue-200 transition-all duration-300 flex flex-col">
            
            <!-- Portrait Image Container -->
            <div class="relative aspect-[4/5] w-full rounded-xl overflow-hidden bg-slate-100">
              <img
                :src="celeb.image"
                :alt="celeb.name"
                onerror="this.src='https://placehold.co/600x750/EFF6FF/2563EB?text=Nominee'"
                class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"
                loading="lazy"
              />
              <!-- Subtle Top Badge if User Voted -->
              <template x-if="celeb.userVotes > 0">
                <div class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-blue-600/95 backdrop-blur-sm text-white text-[11px] font-semibold shadow-sm flex items-center gap-1">
                  <i data-lucide="check" class="w-3 h-3"></i>
                  <span x-text="celeb.userVotes + (celeb.userVotes === 1 ? ' Vote' : ' Votes')"></span>
                </div>
              </template>
            </div>

            <!-- Celebrity Name, Category & Vote Button -->
            <div class="pt-4 pb-1 px-1 flex flex-col flex-1 justify-between gap-4">
              <div>
                <div class="flex items-center gap-1.5 min-w-0">
                  <h2 class="font-bold text-base text-slate-900 truncate" x-text="celeb.name"></h2>
                  <!-- Verified Blue Badge -->
                  <svg class="w-4 h-4 text-blue-600 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-label="Verified">
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.4-6.4 1.5 1.5-7.9 7.9z"/>
                  </svg>
                </div>
                <!-- Artist Category -->
                <p class="mt-0.5 text-xs font-medium text-slate-500 truncate" x-text="celeb.category"></p>
              </div>

              <button
                type="button"
                @click="openVoteModal(celeb)"
                class="w-full py-2.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all duration-200 cursor-pointer"
                :class="celeb.userVotes > 0
                  ? 'bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-600 hover:text-white hover:border-blue-600'
                  : 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm shadow-blue-600/20 active:scale-[0.99]'"
              >
                <i data-lucide="credit-card" class="w-4 h-4"></i>
                <span x-text="celeb.userVotes > 0 ? 'Vote Again' : 'Vote'"></span>
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <!-- Simple Minimal Footer -->
  <footer class="bg-white border-t border-slate-100">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
      <div class="flex items-center gap-2 font-medium text-slate-600">
        <span class="w-2 h-2 rounded-full bg-blue-600"></span>
        <span>StarVote &copy; 2026. All rights reserved.</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="#terms" @click.prevent="showToast('Official 2026 StarVote terms apply to all submissions.')" class="hover:text-blue-600 transition">Terms</a>
        <a href="#privacy" @click.prevent="showToast('All votes are encrypted and securely processed.')" class="hover:text-blue-600 transition">Privacy</a>
        <a href="#support" @click.prevent="showToast('24/7 voter support is available for all verified entries.')" class="hover:text-blue-600 transition">Support</a>
      </div>
    </div>
  </footer>

  <!-- Minimal Vote Checkout Modal -->
  <div
    x-show="modalOpen"
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    @keydown.escape.window="closeModal()"
  >
    <!-- Backdrop -->
    <div
      x-show="modalOpen"
      x-transition:enter="ease-out duration-200"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @click="closeModal()"
      class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs"
    ></div>

    <!-- Modal Panel -->
    <div
      x-show="modalOpen"
      x-transition:enter="ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-95 translate-y-2"
      x-transition:enter-end="opacity-100 scale-100 translate-y-0"
      x-transition:leave="ease-in duration-150"
      x-transition:leave-start="opacity-100 scale-100 translate-y-0"
      x-transition:leave-end="opacity-0 scale-95 translate-y-2"
      class="relative w-full max-w-md bg-white rounded-3xl border border-slate-100 shadow-2xl p-6 z-10"
    >
      <!-- Modal Header with Celebrity Name & Artist Category -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div class="flex items-center gap-3 min-w-0">
          <img
            :src="selectedCeleb?.image"
            :alt="selectedCeleb?.name"
            onerror="this.src='https://placehold.co/100x100/EFF6FF/2563EB?text=Star'"
            class="w-12 h-12 rounded-full object-cover ring-2 ring-blue-100 shrink-0"
          />
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h3 class="text-base font-bold text-slate-900 truncate" x-text="selectedCeleb?.name"></h3>
              <svg class="w-4 h-4 text-blue-600 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.4-6.4 1.5 1.5-7.9 7.9z"/>
              </svg>
            </div>
            <p class="text-xs font-medium text-blue-600 mt-0.5 truncate" x-text="selectedCeleb?.category"></p>
          </div>
        </div>
        <button
          type="button"
          @click="closeModal()"
          aria-label="Close modal"
          class="w-8 h-8 rounded-full bg-slate-50 hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition cursor-pointer shrink-0"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Number of Votes Stepper (Only - / +) -->
      <div class="mt-5">
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-slate-700">Number of Votes</label>
          <span class="text-xs font-medium text-slate-400">$500 / vote</span>
        </div>

        <div class="flex items-center justify-between bg-slate-50 border border-slate-200/80 rounded-2xl p-1.5">
          <button
            type="button"
            @click="decrementVotes()"
            :disabled="voteQuantity <= 1"
            aria-label="Decrease votes"
            class="w-11 h-11 rounded-xl bg-white border border-slate-200/80 text-slate-700 hover:border-blue-300 hover:text-blue-600 disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center shadow-2xs transition cursor-pointer"
          >
            <i data-lucide="minus" class="w-4 h-4"></i>
          </button>

          <input
            type="number"
            min="1"
            max="1000"
            x-model.number="voteQuantity"
            @input="sanitizeQuantity()"
            aria-label="Vote quantity"
            class="w-24 text-center bg-transparent text-xl font-extrabold text-slate-900 focus:outline-none"
          />

          <button
            type="button"
            @click="incrementVotes()"
            aria-label="Increase votes"
            class="w-11 h-11 rounded-xl bg-white border border-slate-200/80 text-slate-700 hover:border-blue-300 hover:text-blue-600 flex items-center justify-center shadow-2xs transition cursor-pointer"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Payment Method Options (Clean Selectable Cards Only) -->
      <div class="mt-5">
        <label class="block text-xs font-semibold text-slate-700 mb-2.5">Payment Method</label>
        <div class="space-y-2.5">
          
          <!-- Option 1: Bitcoin -->
          <button
            type="button"
            @click="paymentMethod = 'Bitcoin'"
            class="w-full flex items-center justify-between p-3.5 rounded-2xl border transition-all cursor-pointer text-left"
            :class="paymentMethod === 'Bitcoin'
              ? 'border-blue-600 bg-blue-50/40 ring-2 ring-blue-600/15'
              : 'border-slate-200/80 bg-white hover:border-slate-300'"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-9 h-9 rounded-xl flex items-center justify-center transition"
                :class="paymentMethod === 'Bitcoin' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'"
              >
                <i data-lucide="bitcoin" class="w-4 h-4"></i>
              </div>
              <span class="text-sm font-semibold text-slate-900">Bitcoin</span>
            </div>
            <div
              class="w-4 h-4 rounded-full border flex items-center justify-center transition"
              :class="paymentMethod === 'Bitcoin' ? 'border-blue-600' : 'border-slate-300'"
            >
              <div x-show="paymentMethod === 'Bitcoin'" class="w-2 h-2 rounded-full bg-blue-600"></div>
            </div>
          </button>

          <!-- Option 2: Giftcard -->
          <button
            type="button"
            @click="paymentMethod = 'Giftcard'"
            class="w-full flex items-center justify-between p-3.5 rounded-2xl border transition-all cursor-pointer text-left"
            :class="paymentMethod === 'Giftcard'
              ? 'border-blue-600 bg-blue-50/40 ring-2 ring-blue-600/15'
              : 'border-slate-200/80 bg-white hover:border-slate-300'"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-9 h-9 rounded-xl flex items-center justify-center transition"
                :class="paymentMethod === 'Giftcard' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'"
              >
                <i data-lucide="gift" class="w-4 h-4"></i>
              </div>
              <span class="text-sm font-semibold text-slate-900">Giftcard</span>
            </div>
            <div
              class="w-4 h-4 rounded-full border flex items-center justify-center transition"
              :class="paymentMethod === 'Giftcard' ? 'border-blue-600' : 'border-slate-300'"
            >
              <div x-show="paymentMethod === 'Giftcard'" class="w-2 h-2 rounded-full bg-blue-600"></div>
            </div>
          </button>

          <!-- Option 3: Bank Transfer -->
          <button
            type="button"
            @click="paymentMethod = 'Bank Transfer'"
            class="w-full flex items-center justify-between p-3.5 rounded-2xl border transition-all cursor-pointer text-left"
            :class="paymentMethod === 'Bank Transfer'
              ? 'border-blue-600 bg-blue-50/40 ring-2 ring-blue-600/15'
              : 'border-slate-200/80 bg-white hover:border-slate-300'"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-9 h-9 rounded-xl flex items-center justify-center transition"
                :class="paymentMethod === 'Bank Transfer' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'"
              >
                <i data-lucide="landmark" class="w-4 h-4"></i>
              </div>
              <span class="text-sm font-semibold text-slate-900">Bank Transfer</span>
            </div>
            <div
              class="w-4 h-4 rounded-full border flex items-center justify-center transition"
              :class="paymentMethod === 'Bank Transfer' ? 'border-blue-600' : 'border-slate-300'"
            >
              <div x-show="paymentMethod === 'Bank Transfer'" class="w-2 h-2 rounded-full bg-blue-600"></div>
            </div>
          </button>

        </div>
      </div>

      <!-- Checkout Total Summary -->
      <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400">Total Amount</p>
          <p class="text-xs font-medium text-slate-600" x-text="voteQuantity + (voteQuantity === 1 ? ' Vote' : ' Votes') + ' • ' + paymentMethod"></p>
        </div>
        <div class="text-right">
          <span class="text-2xl font-extrabold tracking-tight text-slate-900" x-text="'$' + totalPrice.toLocaleString()"></span>
        </div>
      </div>

      <!-- Confirm & Pay CTA -->
      <div class="mt-5">
        <button
          type="button"
          @click="confirmVote()"
          :disabled="isSubmitting"
          class="w-full py-3.5 px-5 rounded-2xl bg-blue-600 hover:bg-blue-700 disabled:opacity-70 text-white font-semibold text-sm shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2 transition cursor-pointer"
        >
          <template x-if="!isSubmitting">
            <span class="flex items-center gap-2">
              <i data-lucide="shield-check" class="w-4 h-4"></i>
              <span x-text="'Confirm & Pay $' + totalPrice.toLocaleString()"></span>
            </span>
          </template>
          <template x-if="isSubmitting">
            <span class="flex items-center gap-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              <span>Processing...</span>
            </span>
          </template>
        </button>
      </div>
    </div>
  </div>

  <!-- Minimal Toast Notification -->
  <div
    x-show="toast.visible"
    x-cloak
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-3"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-3"
    class="fixed bottom-5 right-5 z-50 max-w-sm bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-800 flex items-center gap-3 text-xs font-medium"
  >
    <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center shrink-0">
      <i data-lucide="check" class="w-4 h-4 text-white"></i>
    </div>
    <p x-text="toast.message"></p>
  </div>

  <script>
    function starVoteApp() {
      return {
        pricePerVote: 500,
        totalVotes: 14820,
        modalOpen: false,
        selectedCeleb: null,
        voteQuantity: 1,
        paymentMethod: 'Bitcoin',
        isSubmitting: false,
        toast: {
          visible: false,
          message: '',
          timeout: null
        },
        celebrities: [
          {
            id: 1,
            name: 'Zendaya',
            category: 'Actress & Singer',
            image: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          },
          {
            id: 2,
            name: 'Michael B. Jordan',
            category: 'Actor & Producer',
            image: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          },
          {
            id: 3,
            name: 'Margot Robbie',
            category: 'Actress & Filmmaker',
            image: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          },
          {
            id: 4,
            name: 'Timothée Chalamet',
            category: 'Actor & Style Icon',
            image: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          },
          {
            id: 5,
            name: 'Rihanna',
            category: 'Singer & Mogul',
            image: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          },
          {
            id: 6,
            name: 'Idris Elba',
            category: 'Actor & DJ',
            image: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          },
          {
            id: 7,
            name: 'Selena Gomez',
            category: 'Pop Singer & Actress',
            image: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          },
          {
            id: 8,
            name: 'Chris Evans',
            category: 'Actor & Director',
            image: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=800&q=80',
            userVotes: 0
          }
        ],

        get totalPrice() {
          const qty = Math.max(1, parseInt(this.voteQuantity) || 1);
          return qty * this.pricePerVote;
        },

        initIcons() {
          this.$nextTick(() => {
            if (window.lucide) {
              lucide.createIcons();
            }
          });
        },

        openVoteModal(celeb) {
          this.selectedCeleb = celeb;
          this.voteQuantity = 1;
          this.paymentMethod = 'Bitcoin';
          this.modalOpen = true;
          this.initIcons();
        },

        closeModal() {
          if (this.isSubmitting) return;
          this.modalOpen = false;
        },

        incrementVotes() {
          this.voteQuantity = (parseInt(this.voteQuantity) || 1) + 1;
        },

        decrementVotes() {
          if (this.voteQuantity > 1) {
            this.voteQuantity -= 1;
          }
        },

        sanitizeQuantity() {
          if (!this.voteQuantity || this.voteQuantity < 1) {
            this.voteQuantity = 1;
          }
        },

        confirmVote() {
          if (!this.selectedCeleb || this.isSubmitting) return;
          this.isSubmitting = true;

          const qty = Math.max(1, parseInt(this.voteQuantity) || 1);
          const amount = qty * this.pricePerVote;
          const method = this.paymentMethod;
          const celebName = this.selectedCeleb.name;

          setTimeout(() => {
            this.selectedCeleb.userVotes += qty;
            this.totalVotes += qty;
            this.isSubmitting = false;
            this.modalOpen = false;
            this.initIcons();
            this.showToast(`Confirmed ${qty} ${qty === 1 ? 'vote' : 'votes'} ($${amount.toLocaleString()}) for ${celebName} via ${method}.`);
          }, 600);
        },

        showToast(msg) {
          if (this.toast.timeout) clearTimeout(this.toast.timeout);
          this.toast.message = msg;
          this.toast.visible = true;
          this.initIcons();
          this.toast.timeout = setTimeout(() => {
            this.toast.visible = false;
          }, 4000);
        }
      };
    }
  </script>
</body>
</html>
